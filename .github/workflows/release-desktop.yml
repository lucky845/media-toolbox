name: release-desktop

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, label: macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux 系统依赖（WebKitGTK 4.1 + 打包工具）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: macOS FFmpeg 编译依赖
        if: matrix.os == 'macos-14'
        run: brew install nasm pkg-config

      - run: npm ci

      - name: 拉取并校验 sidecar（FFmpeg/ffprobe，校验 sha256）
        run: node scripts/fetch-sidecars.mjs --target ${{ matrix.target }}

      - name: 构建前端
        run: npx vite build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '本地多媒体工具箱 ${{ github.ref_name }}'
          releaseBody: |
            见 CHANGELOG.md。

            **macOS 未签名**：首次打开需在「应用程序」里右键 → 打开，
            或到「系统设置 → 隐私与安全性」点「仍要打开」。
            这是零成本约束的直接后果（Apple 开发者账号 $99/年）。

            **许可证**：桌面版捆绑的 FFmpeg 为 LGPL-2.1-or-later 构建（不含 libx264/x265），
            LibreOffice 为 MPL-2.0。完整清单见仓库的 THIRD_PARTY_NOTICES.md。
          args: --target ${{ matrix.target }} --config src-tauri/tauri.sidecar.conf.json
