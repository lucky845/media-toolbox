name: release-desktop

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, label: macos-arm64, asset_pattern: "MediaToolbox-[version]-macos-arm64[ext]" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x64, asset_pattern: "MediaToolbox-[version]-win-x64[ext]" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: linux-x64, asset_pattern: "MediaToolbox-[version]-linux-x64[ext]" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux 系统依赖（WebKitGTK 4.1 + 打包工具）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: macOS FFmpeg 编译依赖
        if: matrix.os == 'macos-latest'
        run: brew install nasm pkg-config

      - run: npm ci

      - name: 准备并检查 sidecar（FFmpeg/ffprobe）
        run: node scripts/fetch-sidecars.mjs --target ${{ matrix.target }}

      - name: 生成 release 用合并配置（base + sidecar externalBin）
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open('src-tauri/tauri.sidecar.conf.json', encoding='utf-8') as source:
              config = json.load(source)
          # 使用 ASCII 产品名以兼容 WiX 和发布资产命名。
          config['productName'] = 'MediaToolbox'
          with open('src-tauri/tauri.release.conf.json', 'w', encoding='utf-8') as output:
              json.dump(config, output)
          PY

      - name: 构建前端
        run: npx vite build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          productName: 'MediaToolbox'
          assetNamePattern: ${{ matrix.asset_pattern }}
          releaseName: '本地多媒体工具箱 ${{ github.ref_name }}'
          releaseBody: |
            见 CHANGELOG.md。

            **macOS 安装说明**：此安装包适用于 Apple 芯片，采用 ad hoc 签名，未经 Apple 公证。挂载 DMG 后，把应用拖到「应用程序」再启动。「仍要打开」仅在 macOS 允许为这次启动创建例外时出现。若 DMG 无法挂载、系统提示应用已损坏，或没有提供启动例外，请记录错误原文和 macOS 版本并联系维护者。

            **许可证**：macOS 随包提供 FFmpeg（LGPL-2.1+）和 libvpx（BSD）的许可证。Windows 和 Linux 随包提供 BtbN 发行包的 FFmpeg 许可证（LGPL-3.0）与上游链接。详见仓库 THIRD_PARTY_NOTICES.md。
          args: --target ${{ matrix.target }} --config "${{ github.workspace }}/src-tauri/tauri.release.conf.json"
