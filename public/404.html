<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不存在 · 本地多媒体工具箱</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0b0d10; color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        padding: 24px;
      }
      .box { max-width: 480px; text-align: center; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
      p { color: #9aa7b4; font-size: 14px; line-height: 1.7; margin: 0 0 8px; }
      a { color: #4da3ff; text-decoration: none; }
      a:hover { text-decoration: underline; }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: #14181d; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>这个路径没有对应页面</h1>
      <p>
        本站使用 <strong>hash 路由</strong>（形如 <code>/#/image</code>）。
        GitHub Pages 不支持 SPA rewrite，所以直接访问 <code>/image</code> 这类路径会走到这里。
      </p>
      <!-- 用相对路径：自定义域 base=/ 时解析为 /#/image，项目页 base=/<repo>/ 时解析为 /<repo>/#/image -->
      <p><a href="./#/image">回到图片工具</a> · <a href="./#/help">查看能力与限制</a></p>
    </div>
  </body>
</html>
